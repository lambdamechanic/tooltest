[workspace]
release_always = true
changelog_update = false
pr_body = """
## Commit-derived summary

This section is generated from git history (Conventional Commits) by release-plz.

{% for release in releases -%}
{% if releases | length > 1 %}
### `{{ release.package }}` {{ release.previous_version }} -> {{ release.next_version }}
{% else %}
### {{ release.previous_version }} -> {{ release.next_version }}
{% endif %}
{% if release.changelog -%}
{{ release.changelog }}
{% else -%}
No changes.
{% endif %}

{% endfor -%}

## Changelog pointers

release-plz updates the workspace changelog. Look for the version section(s) listed below:

- [`CHANGELOG.md`](CHANGELOG.md)

---
Generated by release-plz.
"""

[[package]]
name = "tooltest"
release = true
publish = true
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["tooltest-core"]

[[package]]
name = "tooltest-core"
release = true
publish = true
changelog_update = false

[[package]]
name = "tooltest-test-support"
release = false
publish = false
