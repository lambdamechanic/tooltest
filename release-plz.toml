[workspace]
release_always = true
changelog_path = "CHANGELOG.md"
pr_body = """
## Commit-derived summary

This section is generated from git history (Conventional Commits) by release-plz.

{% for release in releases -%}
{% if releases | length > 1 %}
### `{{ release.package }}` {{ release.previous_version }} -> {{ release.next_version }}
{% else %}
### {{ release.previous_version }} -> {{ release.next_version }}
{% endif %}
{% if release.changelog -%}
{{ release.changelog }}
{% else -%}
No changes.
{% endif %}

{% endfor -%}

## Changelog pointers

release-plz also updates these changelog files. Look for the version section(s) listed below.

{% for release in releases -%}
{% if release.package == "tooltest" -%}
- [`tooltest/CHANGELOG.md`](tooltest/CHANGELOG.md) ({{ release.next_version }})
{% elif release.package == "tooltest-core" -%}
- [`tooltest-core/CHANGELOG.md`](tooltest-core/CHANGELOG.md) ({{ release.next_version }})
{% endif -%}
{% endfor -%}
- [`CHANGELOG.md`](CHANGELOG.md) (workspace)

---
Generated by release-plz.
"""

[[package]]
name = "tooltest"
release = true
publish = true
changelog_path = "tooltest/CHANGELOG.md"

[[package]]
name = "tooltest-core"
release = true
publish = true
changelog_path = "tooltest-core/CHANGELOG.md"

[[package]]
name = "tooltest-test-support"
release = false
publish = false
